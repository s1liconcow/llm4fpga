[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "xls-e2e"
version = "0.1.0"
description = "Two auditable MATLAB-to-FPGA experiments: XLS design search and multi-worker Astra RTL regression"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
agent = ["openai>=2.0,<3"]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["fpga_lab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires Icarus/Yosys/nextpnr", "xls: requires the pinned XLS binaries"]
