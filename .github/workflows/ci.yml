name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m py_compile agent_regression.py
      - name: Numerical structured search smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from fpga_lab.problem import Golden, Contract
          from fpga_lab.structured import search
          rows=search(Golden.load(), Contract(), Path("runs/structured"))
          assert rows
          print([r["name"] for r in rows])
          PY
